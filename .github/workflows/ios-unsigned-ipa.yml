name: Build OpenWave iOS IPA

on:
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project mobile/ios/OpenWaveIOS.xcodeproj \
            -scheme OpenWaveIOS \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Package unsigned IPA
        run: |
          rm -rf Payload OpenWave-ios-unsigned.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/OpenWaveIOS.app Payload/OpenWave.app
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload OpenWave-ios-unsigned.ipa
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWave-ios-unsigned
          path: OpenWave-ios-unsigned.ipa
          retention-days: 7
